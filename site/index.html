<script>
  (function () {
    "use strict";
    function read(key) {
      try { return localStorage.getItem(key); } catch (error) { return null; }
    }
    var query = null;
    try { query = new URLSearchParams(window.location.search); } catch (error) { /* ignore */ }
    var queryLang = query ? query.get("lang") : null;
    var storedLang = read("qsl-lang");
    var browserLang = String(navigator.language || "en").toLowerCase().indexOf("zh") === 0 ? "zh-CN" : "en";
    var lang = (queryLang === "en" || queryLang === "zh-CN") ? queryLang
      : ((storedLang === "en" || storedLang === "zh-CN") ? storedLang : browserLang);
    var queryTheme = query ? query.get("theme") : null;
    var storedTheme = read("qsl-theme");
    var theme = (queryTheme === "dark" || queryTheme === "light") ? queryTheme
      : ((storedTheme === "dark" || storedTheme === "light") ? storedTheme
        : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
    document.documentElement.lang = lang;
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
