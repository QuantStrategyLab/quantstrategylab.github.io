name: Documentation check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    uses: QuantStrategyLab/.github/.github/workflows/docs-acceptance.yml@f6f93fa9a096cefcffe4194b28bdeefd16937df0
    with:
      policy-revision: b4966bdd8780cad3ae5154ae50d8b98259a16dc6
      mode: enforce

  docs:
    name: Documentation check
    needs: policy
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require documentation policy acceptance
        run: test "${{ needs.policy.result }}" = "success"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Test the site publication checker
        run: python scripts/test_site.py
      - name: Check site asset and leak rules
        run: python scripts/check_site.py --phase 2
